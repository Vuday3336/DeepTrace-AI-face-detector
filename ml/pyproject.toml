[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deeptrace-ml"
version = "0.1.0"
description = "DeepTrace ML pipeline: data audit, preprocessing, training, evaluation, explainability."
requires-python = ">=3.11"
# Dependencies are pinned in requirements/*.txt (installed explicitly) so that Kaggle's
# preinstalled CUDA builds of torch are never silently replaced by `pip install -e .`.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks/*.ipynb"]  # generated by notebooks/build_notebooks.py

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP038"]  # deprecated rule; tuple isinstance is clearer and faster

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebooks.py" = ["E501"]  # long lines are notebook markdown/cell text
