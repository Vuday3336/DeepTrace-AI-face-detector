name: Deploy to Hugging Face Spaces

# Manual: run after CI is green. Requires repository secret HF_TOKEN (write access) and a Docker Space.
on:
  workflow_dispatch:
    inputs:
      space_id:
        description: "Space id, e.g. your-username/deeptrace"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble Space repository
        run: |
          mkdir -p space/ml space/backend
          cp Dockerfile.spaces space/Dockerfile
          cp deploy/huggingface/README.md space/README.md
          cp -r ml/pyproject.toml ml/src space/ml/
          cp -r backend/app backend/requirements.txt backend/requirements-torch.txt space/backend/
          rsync -a --exclude node_modules --exclude dist frontend/ space/frontend/
          find space -name __pycache__ -type d -prune -exec rm -rf {} +
      - name: Upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub==0.27.0
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          space = "${{ github.event.inputs.space_id }}"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(repo_id=space, repo_type="space", folder_path="space",
                            commit_message=f"Deploy {os.environ['GITHUB_SHA'][:7]}", delete_patterns=["*"])
          print(f"Deployed: https://huggingface.co/spaces/{space}")
          EOF
