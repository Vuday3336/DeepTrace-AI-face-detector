name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ml:
    name: ML pipeline (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    env:
      NO_ALBUMENTATIONS_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements/*.txt
      - name: Install
        run: |
          pip install -r requirements/dev.txt
          pip install -r requirements/torch-cpu.txt --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/facenet.txt --no-deps
          pip install -r requirements/train.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src scripts tests notebooks
      - name: Tests (incl. Grad-CAM parity vs autograd, ONNX export)
        run: pytest

  backend:
    name: Backend API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: "Install (no torch needed: tests use a stub face detector and a tiny ONNX model)"
        run: |
          pip install -r requirements-dev.txt
          pip install -e ../ml --no-deps
      - name: Lint
        run: ruff check app tests
      - name: Tests
        run: pytest

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ml, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Backend image
        run: docker build -f backend/Dockerfile -t deeptrace-backend:ci .
      - name: Frontend image
        run: docker build -t deeptrace-frontend:ci frontend
      - name: Hugging Face Spaces image
        run: docker build -f Dockerfile.spaces -t deeptrace-spaces:ci .
      - name: Smoke-run backend container (no model -> must report degraded, not crash)
        run: |
          docker run -d --name api -p 8000:8000 deeptrace-backend:ci
          for i in $(seq 1 60); do curl -sf localhost:8000/api/v1/health && break; sleep 2; done
          curl -s localhost:8000/api/v1/health | tee health.json
          grep -q '"model_loaded":false' health.json
          docker rm -f api
